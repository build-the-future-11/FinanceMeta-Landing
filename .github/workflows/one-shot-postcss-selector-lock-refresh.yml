name: One-shot postcss-selector-parser lock refresh

on:
  push:
    branches:
      - eng/clear-postcss-selector-low-20260916
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
          cache: npm
          check-latest: false

      - name: Generate package-manager lock refresh
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before
          npm update postcss-selector-parser --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --fund=false
          cmp package.json /tmp/package.json.before
          version="$(node -p "require('./package-lock.json').packages['node_modules/postcss-selector-parser'].version")"
          test "$version" = "6.1.3"
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --fund=false

      - name: Verify advisory is cleared without weakening audit gates
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = report?.metadata?.vulnerabilities;
          if (!vulnerabilities || typeof vulnerabilities !== 'object') process.exit(2);
          if (Number(vulnerabilities.high) !== 0 || Number(vulnerabilities.critical) !== 0) process.exit(1);
          if (report?.vulnerabilities?.['postcss-selector-parser']) process.exit(1);
          NODE
          npm run release:check

      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-postcss-selector-lock-refresh.yml
          git diff --exit-code -- package.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-shot-postcss-selector-lock-refresh.yml
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/one-shot-postcss-selector-lock-refresh.yml package-lock.json "
          git commit -m "fix(deps): clear postcss selector parser advisory"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
