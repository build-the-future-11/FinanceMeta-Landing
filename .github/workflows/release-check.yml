name: Release Check

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify lockfile was not rewritten
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json
      - name: Verify installed production dependency tree
        run: npm ls --omit=dev
      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          set +e
          npm audit --omit=dev --audit-level=high --json > release-evidence/npm-audit-prod.json
          status=$?
          set -e
          test -s release-evidence/npm-audit-prod.json
          exit "$status"
      - name: Run deterministic release gate
        run: npm run release:check
      - name: Verify release output exists and is regular-file only
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          test -z "$(find dist -type l -print -quit)"
      - name: Verify deterministic rebuild
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > release-evidence/dist-first.sha256
          npm run build
          node scripts/verify-release.mjs
          find dist -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > release-evidence/dist-second.sha256
          cmp release-evidence/dist-first.sha256 release-evidence/dist-second.sha256
      - name: Record release provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_commit=%s\n' "${SOURCE_SHA}"
            printf 'workflow_commit=%s\n' "${GITHUB_SHA}"
            printf 'workflow_ref=%s\n' "${GITHUB_REF}"
            printf 'runner_image=%s\n' "${ImageOS:-ubuntu24}"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
          } > release-evidence/provenance.txt
          sha256sum package.json package-lock.json > release-evidence/package-inputs.sha256
          sha256sum scripts/verify-release.mjs scripts/verify-accessibility.mjs > release-evidence/verifier-inputs.sha256
          cp release-evidence/dist-second.sha256 release-evidence/dist-sha256.txt
          test -s release-evidence/dist-sha256.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: finance-meta-release-${{ env.SOURCE_SHA }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 30
