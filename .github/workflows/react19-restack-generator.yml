name: React 19 restack generator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: react19-restack-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'deps/react19-after-jsdom-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify exact source binding
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Verify clean current-main dependency baseline
        run: npm ci --legacy-peer-deps --no-audit --fund=false
      - name: Generate coordinated React 19 dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact --legacy-peer-deps --ignore-scripts --no-audit --fund=false react@19.3.0 react-dom@19.3.0
          npm install --package-lock-only --save-dev --save-exact --legacy-peer-deps --ignore-scripts --no-audit --fund=false @types/react@19.3.0 @types/react-dom@19.3.0
          npm ci --legacy-peer-deps --no-audit --fund=false
          npm ls react react-dom @types/react @types/react-dom jsdom
          node --input-type=module <<'NODE'
          import pkg from './package.json' with { type: 'json' };
          const expected = {
            react: '19.3.0',
            'react-dom': '19.3.0',
            '@types/react': '19.3.0',
            '@types/react-dom': '19.3.0',
            jsdom: '^30.0.1',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = pkg.dependencies?.[name] ?? pkg.devDependencies?.[name];
            if (actual !== version) {
              console.error(`${name}: expected ${version}, got ${actual}`);
              process.exit(1);
            }
          }
          NODE
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'package-lock.json'
          test "${changed[1]}" = 'package.json'
      - name: Commit generated manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'deps: regenerate React 19 graph after jsdom 30'
          git push origin HEAD:${{ github.head_ref }}
