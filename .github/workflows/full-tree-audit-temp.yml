name: Temporary Full Dependency Audit

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Install exact lock
        run: npm ci --legacy-peer-deps --no-audit --fund=false
      - name: Audit complete dependency tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          timeout 180s npm audit --audit-level=high --json --fetch-timeout=150000 --fetch-retries=0 > audit-evidence/npm-audit-full.json
          node --input-type=module - audit-evidence/npm-audit-full.json <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const v = report?.metadata?.vulnerabilities;
          if (!v) throw new Error('missing vulnerability metadata');
          console.log(JSON.stringify(v));
          if (Number(v.high) !== 0 || Number(v.critical) !== 0) process.exit(1);
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jsdom30-full-audit-${{ github.event.pull_request.head.sha }}
          path: audit-evidence
          if-no-files-found: error
          retention-days: 14
